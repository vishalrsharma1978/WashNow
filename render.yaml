services:
  - type: web
    name: washnow
    runtime: static
    # No build step required — the site is plain static HTML/CSS/JS.
    buildCommand: "echo 'No build step required for static site'"
    # Repository root contains index.html, so publish the whole repo.
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # Send unknown paths back to the homepage (single-page friendly).
      - type: rewrite
        source: /*
        destination: /index.html
